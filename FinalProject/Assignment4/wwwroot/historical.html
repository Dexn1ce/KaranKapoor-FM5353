<!DOCTYPE html>
<html>
<head>
    <title>Historical Prices</title>
    <link rel="stylesheet" href="historical.css">
</head>
<body>

<nav>
    <a href="underlying.html">Underlying</a>
    <a href="historical.html">Historical Prices</a>
</nav>

<h1>Historical Prices</h1>

<h2>Load Historical Prices for an Underlying</h2>

<label>Underlying ID:</label>
<input type="number" id="underlyingIdInput" required>
<button onclick="loadPrices()">Load Prices</button>

<h2>Add Historical Price</h2>
<form id="addPriceForm">
    <label> Underlyingid </label>
    <input type="int" id= underlyingid required>
    <label>Date & Time:</label>
    <input type="datetime-local" id="priceTime" required>

    <label>Last Price:</label>
    <input type="number" step="0.01" id="lastPrice" required>

    <button type="submit">Add Price</button>
</form>

<h2>Historical Prices Table</h2>
<table id="priceTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Underlying ID</th>
            <th>Price Time</th>
            <th>Last Price</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="historical.js"></script>
</body>
</html>
