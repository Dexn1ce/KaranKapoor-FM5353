
<!DOCTYPE html>
<html>
<head>
    <title>Lookback Options</title>
    <link rel="stylesheet" href="options.css">
</head>
<body>

<nav>
    <a href="underlying.html">Underlying</a>
    <a href="lookback_options.html">Options</a>
</nav>

<h1>Options Management</h1>

<!-- Load Options -->
<h2>Load Options</h2>
<button onclick="loadOptions()">Load All Options</button>


<h3>Price Result:</h3>
<div id="priceResult" class="result-box">No result yet</div>

<h2>Price Option</h2>

<label>Option ID:</label>
<input type="number" id="priceOptionId">

<label>Simulations (N):</label>
<input type="number" id="simN" value="10000">

<label>Time Steps (M):</label>
<input type="number" id="simM" value="252">

<label>Simulation Date:</label>
<input type="date" id="simDate">

<label>Use Antithetic Variates:</label>
<input type="checkbox" id="useAnt">

<label>Use Control Variates:</label>
<input type="checkbox" id="useCont">

<label>Parallel Execution:</label>
<input type="checkbox" id="isParallel">

<button onclick="priceOption()">Run Pricing</button>

<h3>Pricing Results</h3>

<table id="pricingTable" class="result-box">
    <tr><th>Mean (Price)</th><td id="r_mean">—</td></tr>
    <tr><th>Std Error</th><td id="r_stderr">—</td></tr>
    <tr><th>Delta</th><td id="r_delta">—</td></tr>
    <tr><th>Vega</th><td id="r_vega">—</td></tr>
    <tr><th>Rho</th><td id="r_rho">—</td></tr>
    <tr><th>Theta</th><td id="r_theta">—</td></tr>
</table>




<!-- Add New Option -->
<h2>Add New Option</h2>

<form id="addOptionForm">
    <label>Underlying ID:</label>
    <input type="number" id="underlyingId" required>

    <label>Strike:</label>
    <input type="number" step="0.01" id="strike" required>


    <label>b(cost of carry):</label>
    <input type="number" step="0.01" id="b" required>


    <label>vol(sig):</label>
    <input type="number" step="0.01" id="vol" required>


    <label>Expiry Date:</label>
    <input type="date" id="expiry" required>

    <label>Option Type:</label>
    <select id="optionType" required>
        <option value="call">Call</option>
        <option value="put">Put</option>
    </select>

    <button type="submit">Add Option</button>
</form>

<!-- Table -->
<h2>Options Table</h2>

<table id="optionsTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Underlying</th>
            <th>RateCurve</th>
            <th>Strike</th>
            <th>Expiry</th>
            <th>Type</th>
	    <th>Vol</th>
	    <th>CostOfCarry</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="lookback_options.js"></script>
</body>
</html>
