<h1>Markets </h1>



<h2>Add New Market</h2>
<form id="addMarketForm">
    <label>Exchange</label>
    <input type="int" id ="exchangeid" required>
    <label>Name:</label>
    <input type="text" id="name" required>

    <label>Type:</label>
    <input type="text" id="type" required>

    <button type="submit">Add Market</button>
</form>

<h2>All Markets</h2>
<table id="marketTable">
    <thead>
        <tr>
            <th>ID</th>
	    <th>ExchangeId</th>
            <th>Name</th>
            <th>Type</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>



<script src="market.js"></script>
</body>
