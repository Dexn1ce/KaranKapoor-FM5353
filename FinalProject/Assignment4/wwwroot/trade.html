<!DOCTYPE html>
<html>
<head>
    <title>Trade Management</title>
    <link rel="stylesheet" href="trade.css">
</head>
<body>

<nav>
    <a href="exchange.html">Exchange</a>
    <a href="trade.html">Trades</a>
</nav>

<h1>Trade Management</h1>

<!-- Add Trade Form -->
<h2>Create New Trade</h2>

<form id="addTradeForm">

    <label>Underlying ID:</label>
    <input type="number" id="underlyingId" required>

    <label>Market ID:</label>
    <input type="number" id="marketId" required>

    <label>Direction:</label>
    <select id="direction">
        <option value="BUY">BUY</option>
        <option value="SELL">SELL</option>
    </select>

    <label>Quantity:</label>
    <input type="number" id="quantity" step="1" required>

    <label>Trade Price:</label>
    <input type="number" id="tradePrice" step="0.0001" required>

    <button type="submit">Place Trade</button>

</form>

<!-- Trades Table -->
<h2>All Trades</h2>

<table id="tradeTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Underlying</th>
            <th>Market</th>
            <th>Direction</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Time</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="trade.js"></script>
</body>
</html>
